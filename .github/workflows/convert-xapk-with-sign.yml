name: Convert XAPK to APK (with Signing)

on:
  push:
    paths:
      - '**.xapk'
  workflow_dispatch:
    inputs:
      xapk_url:
        description: 'XAPK 文件 URL (可选)'
        required: false
        type: string
      xapk_path:
        description: '仓库内 XAPK 文件路径 (可选)'
        required: false
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jre-headless

      - name: Install Apktool
        run: |
          
          # Download apktool jar and wrapper script
          wget https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar -O apktool.jar
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          
          # Make executable and move to PATH
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          sudo mv apktool.jar /usr/local/bin/
          
          # Verify installation
          apktool --version
      
      - name: Set up Android SDK Build Tools
        run: |
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
      
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      
      - name: Create signing properties
        run: |
          cat > xapktoapk.sign.properties << 'EOF'
          sign.enabled=true
          sign.keystore.file=${{ github.workspace }}/debug.keystore
          sign.keystore.password=android
          sign.key.alias=androiddebugkey
          sign.key.password=android
          EOF
          ls -la
      
      - name: Download XAPK (if URL provided)
        if: inputs.xapk_url != ''
        run: |
          wget ${{ inputs.xapk_url }} -O input.xapk
          ls -la
      
      - name: Find XAPK file
        id: find-xapk
        run: |
          if [ -f "input.xapk" ]; then
            echo "xapk_path=input.xapk" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.xapk_path }}" ]; then
            echo "xapk_path=${{ inputs.xapk_path }}" >> $GITHUB_OUTPUT
          else
            XAPK_FILE=$(find . -name "*.xapk" -type f | head -n 1)
            if [ -z "$XAPK_FILE" ]; then
              echo "No XAPK file found!"
              exit 1
            fi
            echo "xapk_path=$XAPK_FILE" >> $GITHUB_OUTPUT
          fi
      
      - name: Check tool availability
        run: |
          echo "PATH: $PATH"
          which apktool
          apktool --version
          which zipalign
          zipalign --version
          which apksigner
          apksigner --version
      
      - name: Convert XAPK to APK (with verbose output)
        run: |
          XAPK_FILE="${{ steps.find-xapk.outputs.xapk_path }}"
          # Temporarily modify script to show errors
          sed -i 's/stdout=DEVNULL, stderr=STDOUT//g' xapktoapk.py
          python xapktoapk.py "$XAPK_FILE"
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-signed-apk
          path: '*.apk'
          retention-days: 30
